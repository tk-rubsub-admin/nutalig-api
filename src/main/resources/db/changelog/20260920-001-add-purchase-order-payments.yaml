databaseChangeLog:
  - changeSet:
      id: 20260920-001-add-purchase-order-payments
      author: codex
      changes:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE purchase_order
                  ADD COLUMN payment_status VARCHAR(30) NOT NULL DEFAULT 'UNPAID' AFTER grand_total_thb,
                  ADD COLUMN paid_total DECIMAL(18,5) NOT NULL DEFAULT 0 AFTER payment_status,
                  ADD COLUMN paid_total_thb DECIMAL(18,5) NOT NULL DEFAULT 0 AFTER paid_total,
                  ADD COLUMN outstanding_total DECIMAL(18,5) NOT NULL DEFAULT 0 AFTER paid_total_thb,
                  ADD COLUMN outstanding_total_thb DECIMAL(18,5) NOT NULL DEFAULT 0 AFTER outstanding_total;

              UPDATE purchase_order
              SET outstanding_total = COALESCE(grand_total, 0),
                  outstanding_total_thb = COALESCE(grand_total_thb, 0)
              WHERE paid_total = 0;

              CREATE TABLE purchase_order_payment (
                  id BIGINT NOT NULL AUTO_INCREMENT,
                  purchase_order_no VARCHAR(50) NOT NULL,
                  payment_type VARCHAR(30) NOT NULL,
                  installment_no INT DEFAULT NULL,
                  payment_date DATETIME(6) NOT NULL,
                  amount DECIMAL(18,5) NOT NULL,
                  currency VARCHAR(10) NOT NULL,
                  exchange_rate DECIMAL(18,6) NOT NULL,
                  amount_thb DECIMAL(18,5) NOT NULL,
                  payment_method VARCHAR(30) NOT NULL,
                  transfer_reference VARCHAR(255) DEFAULT NULL,
                  cheque_bank VARCHAR(255) DEFAULT NULL,
                  cheque_no VARCHAR(100) DEFAULT NULL,
                  cheque_date DATE DEFAULT NULL,
                  cheque_branch VARCHAR(255) DEFAULT NULL,
                  remark VARCHAR(2000) DEFAULT NULL,
                  status VARCHAR(30) NOT NULL,
                  rejection_reason VARCHAR(2000) DEFAULT NULL,
                  approved_by VARCHAR(255) DEFAULT NULL,
                  approved_date DATETIME(6) DEFAULT NULL,
                  rejected_by VARCHAR(255) DEFAULT NULL,
                  rejected_date DATETIME(6) DEFAULT NULL,
                  voided_by VARCHAR(255) DEFAULT NULL,
                  voided_date DATETIME(6) DEFAULT NULL,
                  void_reason VARCHAR(2000) DEFAULT NULL,
                  request_key VARCHAR(100) DEFAULT NULL,
                  created_by VARCHAR(255) DEFAULT NULL,
                  updated_by VARCHAR(255) DEFAULT NULL,
                  created_date DATETIME(6) DEFAULT NULL,
                  updated_date DATETIME(6) DEFAULT NULL,
                  PRIMARY KEY (id),
                  UNIQUE KEY uk_po_payment_request_key (request_key),
                  KEY idx_po_payment_po_no (purchase_order_no),
                  KEY idx_po_payment_status (status),
                  KEY idx_po_payment_payment_date (payment_date),
                  CONSTRAINT fk_po_payment_po FOREIGN KEY (purchase_order_no) REFERENCES purchase_order (purchase_order_no),
                  CONSTRAINT fk_po_payment_approved_by FOREIGN KEY (approved_by) REFERENCES user (id),
                  CONSTRAINT fk_po_payment_rejected_by FOREIGN KEY (rejected_by) REFERENCES user (id),
                  CONSTRAINT fk_po_payment_voided_by FOREIGN KEY (voided_by) REFERENCES user (id),
                  CONSTRAINT fk_po_payment_created_by FOREIGN KEY (created_by) REFERENCES user (id),
                  CONSTRAINT fk_po_payment_updated_by FOREIGN KEY (updated_by) REFERENCES user (id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

              CREATE TABLE purchase_order_payment_attachment (
                  id BIGINT NOT NULL AUTO_INCREMENT,
                  purchase_order_payment_id BIGINT NOT NULL,
                  file_name VARCHAR(255) NOT NULL,
                  original_file_name VARCHAR(255) DEFAULT NULL,
                  file_url VARCHAR(500) NOT NULL,
                  content_type VARCHAR(100) DEFAULT NULL,
                  file_size BIGINT DEFAULT NULL,
                  sort_order INT DEFAULT NULL,
                  created_date DATETIME(6) DEFAULT NULL,
                  updated_date DATETIME(6) DEFAULT NULL,
                  PRIMARY KEY (id),
                  KEY idx_po_payment_attachment_payment_id (purchase_order_payment_id),
                  CONSTRAINT fk_po_payment_attachment_payment
                      FOREIGN KEY (purchase_order_payment_id) REFERENCES purchase_order_payment (id) ON DELETE CASCADE
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

              INSERT INTO permission (code, name_th, name_en, `group`, created_at) VALUES
                  ('PERM_PURCHASE_ORDER_PAYMENT_VIEW', 'ดูรายการชำระเงินใบสั่งซื้อ', 'View purchase order payments', 'purchase_order', NOW(6)),
                  ('PERM_PURCHASE_ORDER_PAYMENT_CREATE', 'บันทึกรายการชำระเงินใบสั่งซื้อ', 'Create purchase order payments', 'purchase_order', NOW(6)),
                  ('PERM_PURCHASE_ORDER_PAYMENT_APPROVE', 'อนุมัติรายการชำระเงินใบสั่งซื้อ', 'Approve purchase order payments', 'purchase_order', NOW(6)),
                  ('PERM_PURCHASE_ORDER_PAYMENT_VOID', 'ยกเลิกรายการชำระเงินใบสั่งซื้อ', 'Void purchase order payments', 'purchase_order', NOW(6))
              ON DUPLICATE KEY UPDATE
                  name_th = VALUES(name_th),
                  name_en = VALUES(name_en),
                  `group` = VALUES(`group`);

              INSERT IGNORE INTO role_permission (role_code, permission_code) VALUES
                  ('SUPER_ADMIN', 'PERM_PURCHASE_ORDER_PAYMENT_VIEW'),
                  ('SUPER_ADMIN', 'PERM_PURCHASE_ORDER_PAYMENT_CREATE'),
                  ('SUPER_ADMIN', 'PERM_PURCHASE_ORDER_PAYMENT_APPROVE'),
                  ('SUPER_ADMIN', 'PERM_PURCHASE_ORDER_PAYMENT_VOID'),
                  ('PROCUREMENT', 'PERM_PURCHASE_ORDER_PAYMENT_VIEW'),
                  ('PROCUREMENT', 'PERM_PURCHASE_ORDER_PAYMENT_CREATE'),
                  ('PROCUREMENT_ADMIN', 'PERM_PURCHASE_ORDER_PAYMENT_VIEW'),
                  ('PROCUREMENT_ADMIN', 'PERM_PURCHASE_ORDER_PAYMENT_CREATE'),
                  ('PROCUREMENT_MANAGER', 'PERM_PURCHASE_ORDER_PAYMENT_VIEW'),
                  ('PROCUREMENT_MANAGER', 'PERM_PURCHASE_ORDER_PAYMENT_CREATE'),
                  ('ACCOUNT', 'PERM_PURCHASE_ORDER_VIEW'),
                  ('ACCOUNT', 'PERM_PURCHASE_ORDER_PAYMENT_VIEW'),
                  ('ACCOUNT', 'PERM_PURCHASE_ORDER_PAYMENT_APPROVE'),
                  ('ACCOUNT', 'PERM_PURCHASE_ORDER_PAYMENT_VOID'),
                  ('ACCOUNT_ADMIN', 'PERM_PURCHASE_ORDER_VIEW'),
                  ('ACCOUNT_ADMIN', 'PERM_PURCHASE_ORDER_PAYMENT_VIEW'),
                  ('ACCOUNT_ADMIN', 'PERM_PURCHASE_ORDER_PAYMENT_APPROVE'),
                  ('ACCOUNT_ADMIN', 'PERM_PURCHASE_ORDER_PAYMENT_VOID'),
                  ('ADMIN', 'PERM_PURCHASE_ORDER_PAYMENT_VIEW'),
                  ('ADMIN', 'PERM_PURCHASE_ORDER_PAYMENT_APPROVE'),
                  ('ADMIN', 'PERM_PURCHASE_ORDER_PAYMENT_VOID');
