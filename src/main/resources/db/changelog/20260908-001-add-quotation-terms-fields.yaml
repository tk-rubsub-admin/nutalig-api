databaseChangeLog:
  - changeSet:
      id: 20260908-001-add-quotation-sample-lead-time
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: quotations
                columnName: sample_lead_time
      changes:
        - addColumn:
            tableName: quotations
            columns:
              - column:
                  name: sample_lead_time
                  type: VARCHAR(255)

