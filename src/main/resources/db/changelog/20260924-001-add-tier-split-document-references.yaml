databaseChangeLog:
  - changeSet:
      id: 20260924-001-add-quotation-tier-split-reference
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: quotation_detail
        - not:
            - columnExists:
                tableName: quotation_detail
                columnName: tier_split_id
      changes:
        - addColumn:
            tableName: quotation_detail
            columns:
              - column:
                  name: tier_split_id
                  type: BIGINT
        - createIndex:
            tableName: quotation_detail
            indexName: idx_quotation_detail_tier_split_id
            columns:
              - column:
                  name: tier_split_id
        - addForeignKeyConstraint:
            baseTableName: quotation_detail
            baseColumnNames: tier_split_id
            referencedTableName: rfq_tier_split
            referencedColumnNames: id
            constraintName: fk_quotation_detail_tier_split
            onDelete: SET NULL

