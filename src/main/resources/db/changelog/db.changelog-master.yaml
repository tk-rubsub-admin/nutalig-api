databaseChangeLog:
  - changeSet:
      id: 20260711-001-add-is-active-to-product-family
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: product_family
                columnName: is_active
      changes:
        - addColumn:
            tableName: product_family
            columns:
              - column:
                  name: is_active
                  type: TINYINT(1)
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false

  - changeSet:
      id: 20260604-001-create-rfq-supplier-quote-tables
      author: codex
      validCheckSum:
        - 9:632d496aae24b64d72257b7240c5cd73
        - 9:70ec8e0ba13e9f6dd801e9f5eaa660eb
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE IF NOT EXISTS rfq_supplier_quote (
                  id VARCHAR(255) NOT NULL,
                  rfq_header_id VARCHAR(255) NOT NULL,
                  supplier_id VARCHAR(255) NOT NULL,
                  inquiry_id VARCHAR(255) DEFAULT NULL,
                  status VARCHAR(50) NOT NULL,
                  remark TEXT DEFAULT NULL,
                  created_by VARCHAR(255) DEFAULT NULL,
                  updated_by VARCHAR(255) DEFAULT NULL,
                  created_date DATETIME(6) DEFAULT NULL,
                  updated_date DATETIME(6) DEFAULT NULL,
                  PRIMARY KEY (id),
                  UNIQUE KEY uk_rfq_supplier_quote_rfq_supplier (rfq_header_id, supplier_id),
                  KEY idx_rfq_supplier_quote_rfq (rfq_header_id),
                  KEY idx_rfq_supplier_quote_supplier (supplier_id),
                  KEY idx_rfq_supplier_quote_inquiry (inquiry_id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;
              CREATE TABLE IF NOT EXISTS rfq_supplier_quote_detail (
                  id BIGINT NOT NULL AUTO_INCREMENT,
                  quote_id VARCHAR(255) NOT NULL,
                  rfq_detail_id BIGINT DEFAULT NULL,
                  option_name VARCHAR(255) DEFAULT NULL,
                  spec TEXT NOT NULL,
                  sort_order INT DEFAULT NULL,
                  remark TEXT DEFAULT NULL,
                  created_date DATETIME(6) DEFAULT NULL,
                  updated_date DATETIME(6) DEFAULT NULL,
                  PRIMARY KEY (id),
                  KEY idx_rfq_supplier_quote_detail_quote (quote_id),
                  KEY idx_rfq_supplier_quote_detail_rfq_detail (rfq_detail_id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

              CREATE TABLE IF NOT EXISTS rfq_supplier_quote_detail_package (
                  id BIGINT NOT NULL AUTO_INCREMENT,
                  quote_detail_id BIGINT NOT NULL,
                  package_dimension TEXT DEFAULT NULL,
                  package_weight TEXT DEFAULT NULL,
                  package_capacity TEXT DEFAULT NULL,
                  sort_order INT DEFAULT NULL,
                  created_date DATETIME(6) DEFAULT NULL,
                  updated_date DATETIME(6) DEFAULT NULL,
                  PRIMARY KEY (id),
                  KEY idx_rfq_supplier_quote_detail_package_detail (quote_detail_id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

              CREATE TABLE IF NOT EXISTS rfq_supplier_quote_tier (
                  id BIGINT NOT NULL AUTO_INCREMENT,
                  quote_detail_id BIGINT NOT NULL,
                  quantity DECIMAL(18,0) NOT NULL,
                  product_price DECIMAL(18,4) NOT NULL,
                  land_freight_cost DECIMAL(18,4) DEFAULT NULL,
                  sea_freight_cost DECIMAL(18,4) DEFAULT NULL,
                  land_total_price DECIMAL(18,4) DEFAULT NULL,
                  sea_total_price DECIMAL(18,4) DEFAULT NULL,
                  sort_order INT DEFAULT NULL,
                  created_date DATETIME(6) DEFAULT NULL,
                  updated_date DATETIME(6) DEFAULT NULL,
                  PRIMARY KEY (id),
                  KEY idx_rfq_supplier_quote_tier_detail (quote_detail_id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

              CREATE TABLE IF NOT EXISTS rfq_supplier_quote_additional_cost (
                  id BIGINT NOT NULL AUTO_INCREMENT,
                  quote_id VARCHAR(255) NOT NULL,
                  description TEXT NOT NULL,
                  unit VARCHAR(50) DEFAULT NULL,
                  value VARCHAR(255) DEFAULT NULL,
                  sort_order INT DEFAULT NULL,
                  created_date DATETIME(6) DEFAULT NULL,
                  updated_date DATETIME(6) DEFAULT NULL,
                  PRIMARY KEY (id),
                  KEY idx_rfq_supplier_quote_additional_cost_quote (quote_id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

