  - changeSet:
      id: 20260612-001-create-search-field-visibility-tables
      author: codex
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE IF NOT EXISTS search_screen (
                  screen_code VARCHAR(64) NOT NULL,
                  name_th VARCHAR(255) DEFAULT NULL,
                  name_en VARCHAR(255) DEFAULT NULL,
                  module_code VARCHAR(64) DEFAULT NULL,
                  active BOOLEAN NOT NULL DEFAULT TRUE,
                  created_date DATETIME(6) DEFAULT NULL,
                  updated_date DATETIME(6) DEFAULT NULL,
                  PRIMARY KEY (screen_code),
                  KEY idx_search_screen_module_code (module_code),
                  KEY idx_search_screen_active (active)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

              CREATE TABLE IF NOT EXISTS search_field (
                  screen_code VARCHAR(64) NOT NULL,
                  field_code VARCHAR(64) NOT NULL,
                  label_th VARCHAR(255) DEFAULT NULL,
                  label_en VARCHAR(255) DEFAULT NULL,
                  input_type VARCHAR(32) NOT NULL,
                  sort_order INT DEFAULT NULL,
                  active BOOLEAN NOT NULL DEFAULT TRUE,
                  created_date DATETIME(6) DEFAULT NULL,
                  updated_date DATETIME(6) DEFAULT NULL,
                  PRIMARY KEY (screen_code, field_code),
                  KEY idx_search_field_screen_active_sort (screen_code, active, sort_order)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

              CREATE TABLE IF NOT EXISTS role_search_field_visibility (
                  role_code VARCHAR(64) NOT NULL,
                  screen_code VARCHAR(64) NOT NULL,
                  field_code VARCHAR(64) NOT NULL,
                  visible BOOLEAN NOT NULL DEFAULT FALSE,
                  updated_by VARCHAR(100) DEFAULT NULL,
                  created_date DATETIME(6) DEFAULT NULL,
                  updated_date DATETIME(6) DEFAULT NULL,
                  PRIMARY KEY (role_code, screen_code, field_code),
                  KEY idx_role_search_field_role_screen_visible (role_code, screen_code, visible),
                  KEY idx_role_search_field_screen_field (screen_code, field_code)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

