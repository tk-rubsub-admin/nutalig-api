  - changeSet:
      id: 20260713-001-add-rfq-search-fields-product-subtype1-material
      author: codex
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO search_field (screen_code, field_code, label_th, label_en, input_type, sort_order, active, created_date, updated_date) VALUES
              ('RFQ_LIST', 'productSubtype1', 'Product Subtype 1', 'Product Subtype 1', 'SELECT', 55, TRUE, NOW(6), NOW(6)),
              ('RFQ_LIST', 'productMaterial', 'Product Material', 'Product Material', 'SELECT', 56, TRUE, NOW(6), NOW(6))
              ON DUPLICATE KEY UPDATE
                  label_th = VALUES(label_th),
                  label_en = VALUES(label_en),
                  input_type = VALUES(input_type),
                  sort_order = VALUES(sort_order),
                  active = VALUES(active),
                  updated_date = NOW(6);

              INSERT INTO role_search_field_visibility (role_code, screen_code, field_code, visible, updated_by, created_date, updated_date)
              SELECT role_code, screen_code, 'productSubtype1', visible, updated_by, NOW(6), NOW(6)
              FROM role_search_field_visibility
              WHERE screen_code = 'RFQ_LIST' AND field_code = 'productFamily'
              ON DUPLICATE KEY UPDATE
                  visible = VALUES(visible),
                  updated_by = VALUES(updated_by),
                  updated_date = NOW(6);

              INSERT INTO role_search_field_visibility (role_code, screen_code, field_code, visible, updated_by, created_date, updated_date)
              SELECT role_code, screen_code, 'productMaterial', visible, updated_by, NOW(6), NOW(6)
              FROM role_search_field_visibility
              WHERE screen_code = 'RFQ_LIST' AND field_code = 'productFamily'
              ON DUPLICATE KEY UPDATE
