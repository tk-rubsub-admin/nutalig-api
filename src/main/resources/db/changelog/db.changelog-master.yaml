  - changeSet:
      id: 20260720-003-add-total-sales-order-amount-to-customer
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: customer
                columnName: total_sales_order_amount
      changes:
        - addColumn:
            tableName: customer
            columns:
              - column:
                  name: total_sales_order_amount
                  type: DECIMAL(18,2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - sql:
            sql: |
              UPDATE customer c
              LEFT JOIN (
                  SELECT customer_id, COALESCE(SUM(grand_total), 0) AS total_amount
                  FROM sales_order
                  WHERE customer_id IS NOT NULL
                    AND status NOT IN ('REJECTED', 'CANCELLED')
                  GROUP BY customer_id
              ) so ON so.customer_id = c.id
              SET c.total_sales_order_amount = COALESCE(so.total_amount, 0);

  - changeSet:
      id: 20260721-001-add-rfq-reference-to-quotation
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: quotations
                columnName: rfq_id
      changes:
        - addColumn:
            tableName: quotations
            columns:
              - column:
                  name: rfq_id
                  type: VARCHAR(50)
              - column:
                  name: reference_rfq_id
                  type: VARCHAR(50)
        - addForeignKeyConstraint:
            baseTableName: quotations
            baseColumnNames: rfq_id
            referencedTableName: rfq_header
            referencedColumnNames: id
            constraintName: fk_quotations_rfq_id
        - addForeignKeyConstraint:
            baseTableName: quotations
            baseColumnNames: reference_rfq_id
            referencedTableName: rfq_header
            referencedColumnNames: id
            constraintName: fk_quotations_reference_rfq_id
        - sql:
            sql: |
              UPDATE quotations q
              JOIN rfq_header r ON r.quotation_no = q.quotation_no
              SET q.rfq_id = r.id,
                  q.reference_rfq_id = r.reference_rfq_id
              WHERE q.rfq_id IS NULL;
