  - changeSet:
      id: 20260609-001-create-user-role-mapping
      author: codex
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE IF NOT EXISTS user_role_mapping (
                  user_id VARCHAR(64) NOT NULL,
                  role_code VARCHAR(64) NOT NULL,
                  PRIMARY KEY (user_id, role_code),
                  KEY idx_user_role_mapping_user_id (user_id),
                  KEY idx_user_role_mapping_role_code (role_code)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

              INSERT IGNORE INTO user_role_mapping (user_id, role_code)
              SELECT id, role_code
              FROM `user`
              WHERE role_code IS NOT NULL AND role_code <> '';

  - changeSet:
      id: 20260609-002-expand-user-id-columns-to-100
      author: codex
      changes:
        - sql:
            splitStatements: true
            sql: |
              SET @drop_uop_fk = (
                  SELECT IF(
                      COUNT(*) > 0,
                      'ALTER TABLE user_permission_override DROP FOREIGN KEY fk_uop_user',
                      'SELECT 1'
                  )
                  FROM information_schema.TABLE_CONSTRAINTS
                  WHERE CONSTRAINT_SCHEMA = DATABASE()
                    AND TABLE_NAME = 'user_permission_override'
                    AND CONSTRAINT_NAME = 'fk_uop_user'
                    AND CONSTRAINT_TYPE = 'FOREIGN KEY'
              );
              PREPARE stmt FROM @drop_uop_fk;
              EXECUTE stmt;
              DEALLOCATE PREPARE stmt;

              SET @drop_user_role_mapping_fk = (
                  SELECT IF(
                      COUNT(*) > 0,
                      'ALTER TABLE user_role_mapping DROP FOREIGN KEY fk_user_role_mapping_user',
                      'SELECT 1'
                  )
                  FROM information_schema.TABLE_CONSTRAINTS
                  WHERE CONSTRAINT_SCHEMA = DATABASE()
                    AND TABLE_NAME = 'user_role_mapping'
                    AND CONSTRAINT_NAME = 'fk_user_role_mapping_user'
                    AND CONSTRAINT_TYPE = 'FOREIGN KEY'
              );
              PREPARE stmt FROM @drop_user_role_mapping_fk;
              EXECUTE stmt;
              DEALLOCATE PREPARE stmt;

              ALTER TABLE user_permission_override
                MODIFY COLUMN user_id VARCHAR(100) CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci NOT NULL;

              ALTER TABLE user_role_mapping
                MODIFY COLUMN user_id VARCHAR(100) CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci NOT NULL;

              ALTER TABLE `user`
                MODIFY COLUMN id VARCHAR(100) CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci NOT NULL;

              ALTER TABLE user_permission_override
                ADD CONSTRAINT fk_uop_user FOREIGN KEY (user_id) REFERENCES `user` (id);

              ALTER TABLE user_role_mapping
                ADD CONSTRAINT fk_user_role_mapping_user FOREIGN KEY (user_id) REFERENCES `user` (id);

  - changeSet:
      id: 20260609-003-add-user-role-mapping-primary-role
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: user_role_mapping
                columnName: primary_role
      changes:
        - addColumn:
