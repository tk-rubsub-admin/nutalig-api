  - changeSet:
      id: 20260613-001-create-calendar-event-table
      author: codex
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE IF NOT EXISTS calendar_event (
                  id BIGINT NOT NULL AUTO_INCREMENT,
                  title VARCHAR(255) NOT NULL,
                  description TEXT DEFAULT NULL,
                  event_type VARCHAR(50) NOT NULL,
                  status VARCHAR(30) NOT NULL,
                  start_at DATETIME(6) NOT NULL,
                  end_at DATETIME(6) NOT NULL,
                  all_day BOOLEAN NOT NULL DEFAULT FALSE,
                  color_code VARCHAR(32) DEFAULT NULL,
                  source_module VARCHAR(64) DEFAULT NULL,
                  source_id VARCHAR(255) DEFAULT NULL,
                  customer_id VARCHAR(255) DEFAULT NULL,
                  supplier_id VARCHAR(255) DEFAULT NULL,
                  assigned_to_employee_id VARCHAR(255) DEFAULT NULL,
                  location VARCHAR(255) DEFAULT NULL,
                  remark TEXT DEFAULT NULL,
                  active BOOLEAN NOT NULL DEFAULT TRUE,
                  created_by VARCHAR(255) DEFAULT NULL,
                  updated_by VARCHAR(255) DEFAULT NULL,
                  created_date DATETIME(6) DEFAULT NULL,
                  updated_date DATETIME(6) DEFAULT NULL,
                  PRIMARY KEY (id),
                  KEY idx_calendar_event_start_at (start_at),
                  KEY idx_calendar_event_end_at (end_at),
                  KEY idx_calendar_event_type_status (event_type, status),
                  KEY idx_calendar_event_source (source_module, source_id),
                  KEY idx_calendar_event_active (active),
                  KEY idx_calendar_event_customer (customer_id),
                  KEY idx_calendar_event_supplier (supplier_id),
                  KEY idx_calendar_event_employee (assigned_to_employee_id),
                  CONSTRAINT fk_calendar_event_customer FOREIGN KEY (customer_id) REFERENCES customer (id),
                  CONSTRAINT fk_calendar_event_supplier FOREIGN KEY (supplier_id) REFERENCES supplier (id),
                  CONSTRAINT fk_calendar_event_employee FOREIGN KEY (assigned_to_employee_id) REFERENCES employee (employee_id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

