  - changeSet:
      id: 20260702-003-detach-supplier-shipping-from-supplier
      author: codex
      changes:
        - sql:
            splitStatements: true
            sql: |
              SET @fk_exists := (
                  SELECT COUNT(*)
                  FROM information_schema.TABLE_CONSTRAINTS
                  WHERE CONSTRAINT_SCHEMA = DATABASE()
                    AND TABLE_NAME = 'supplier_shipping'
                    AND CONSTRAINT_NAME = 'fk_supplier_shipping_supplier'
              );
              SET @drop_fk_sql := IF(
                  @fk_exists > 0,
                  'ALTER TABLE supplier_shipping DROP FOREIGN KEY fk_supplier_shipping_supplier',
                  'SELECT 1'
              );
              PREPARE stmt FROM @drop_fk_sql;
              EXECUTE stmt;
              DEALLOCATE PREPARE stmt;

              SET @idx_exists := (
                  SELECT COUNT(*)
                  FROM information_schema.STATISTICS
                  WHERE TABLE_SCHEMA = DATABASE()
                    AND TABLE_NAME = 'supplier_shipping'
                    AND INDEX_NAME = 'idx_supplier_shipping_supplier_id'
              );
              SET @drop_idx_sql := IF(
                  @idx_exists > 0,
                  'ALTER TABLE supplier_shipping DROP INDEX idx_supplier_shipping_supplier_id',
                  'SELECT 1'
              );
              PREPARE stmt FROM @drop_idx_sql;
              EXECUTE stmt;
              DEALLOCATE PREPARE stmt;

              SET @col_exists := (
                  SELECT COUNT(*)
                  FROM information_schema.COLUMNS
                  WHERE TABLE_SCHEMA = DATABASE()
                    AND TABLE_NAME = 'supplier_shipping'
                    AND COLUMN_NAME = 'supplier_id'
              );
              SET @drop_col_sql := IF(
                  @col_exists > 0,
                  'ALTER TABLE supplier_shipping DROP COLUMN supplier_id',
                  'SELECT 1'
              );
              PREPARE stmt FROM @drop_col_sql;
              EXECUTE stmt;
              DEALLOCATE PREPARE stmt;
