              ('SALE_ORDER_LIST', 'salesOrderNo', 'เลขที่เอกสาร', 'Sales order no.', 'TEXT', 10, TRUE, NOW(6), NOW(6)),
              ('SALE_ORDER_LIST', 'customerId', 'รหัสลูกค้า', 'Customer ID', 'TEXT', 20, TRUE, NOW(6), NOW(6)),
              ('SALE_ORDER_LIST', 'salesId', 'รหัสเซลล์', 'Sales ID', 'TEXT', 30, TRUE, NOW(6), NOW(6)),
              ('SALE_ORDER_LIST', 'status', 'สถานะ', 'Status', 'SELECT', 40, TRUE, NOW(6), NOW(6)),
              ('SALE_ORDER_LIST', 'docDateStart', 'วันที่เอกสารเริ่มต้น', 'Document date from', 'DATE', 50, TRUE, NOW(6), NOW(6)),
              ('SALE_ORDER_LIST', 'docDateEnd', 'วันที่เอกสารสิ้นสุด', 'Document date to', 'DATE', 60, TRUE, NOW(6), NOW(6)),
              ('SALE_ORDER_LIST', 'keyword', 'คำค้นหา', 'Keyword', 'TEXT', 70, TRUE, NOW(6), NOW(6))
