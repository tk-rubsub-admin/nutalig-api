  - changeSet:
      id: 20260605-009-create-authorization-tables
      author: codex
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE IF NOT EXISTS permission (
                  code VARCHAR(64) NOT NULL,
                  name_th VARCHAR(255) DEFAULT NULL,
                  name_en VARCHAR(255) DEFAULT NULL,
                  `group` VARCHAR(128) DEFAULT NULL,
                  created_at DATETIME(6) DEFAULT NULL,
                  PRIMARY KEY (code)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

              CREATE TABLE IF NOT EXISTS role_permission (
                  role_code VARCHAR(64) NOT NULL,
                  permission_code VARCHAR(64) NOT NULL,
                  PRIMARY KEY (role_code, permission_code),
                  KEY idx_role_permission_role_code (role_code),
                  KEY idx_role_permission_permission_code (permission_code)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

              CREATE TABLE IF NOT EXISTS user_permission_override (
                  user_id VARCHAR(64) NOT NULL,
                  permission_code VARCHAR(64) NOT NULL,
                  effect VARCHAR(16) NOT NULL,
                  created_at DATETIME(6) DEFAULT NULL,
                  created_by VARCHAR(255) DEFAULT NULL,
                  PRIMARY KEY (user_id, permission_code),
                  KEY idx_user_permission_override_user_id (user_id),
                  KEY idx_user_permission_override_permission_code (permission_code)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

