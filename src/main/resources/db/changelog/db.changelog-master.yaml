            columns:
              - column:
                  name: primary_role
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 20260609-004-seed-user-role-mapping-primary-role
      author: codex
      changes:
        - sql:
            splitStatements: true
            sql: |
              UPDATE user_role_mapping
              SET primary_role = false
              WHERE primary_role IS NULL;

              UPDATE user_role_mapping urm
              JOIN `user` u ON u.id = urm.user_id AND u.role_code = urm.role_code
              SET urm.primary_role = true;

              UPDATE user_role_mapping urm
              JOIN (
                  SELECT user_id, MIN(role_code) AS role_code
                  FROM user_role_mapping
                  GROUP BY user_id
              ) first_role ON first_role.user_id = urm.user_id AND first_role.role_code = urm.role_code
              LEFT JOIN (
                  SELECT user_id
                  FROM user_role_mapping
                  WHERE primary_role = true
                  GROUP BY user_id
              ) primary_role_user ON primary_role_user.user_id = urm.user_id
              SET urm.primary_role = true
              WHERE primary_role_user.user_id IS NULL;

