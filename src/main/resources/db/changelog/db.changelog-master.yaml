              ALTER TABLE rfq_supplier_quote_detail CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
              ALTER TABLE rfq_supplier_quote_tier CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
              ALTER TABLE rfq_supplier_quote_additional_cost CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;

